<!DOCTYPE html>
<head>
	<link rel="stylesheet" href="/style.css">
	<title>Rowan Vignali Portfolio</title>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/bg.js" type="module"></script>
<div class="unscroll">
	<div class="doc">
		<div>
			<div class="clear white" style="--a-ratio: 1/1.6; height: 60%; aspect-ratio: var(--a-ratio);">
				<button id="name" class="clear black" style="width: 100%; height: 15%; font-weight: bold; --intensity: 10;; --click-color-intensity: 1.2; position: absolute;">Rowan Vignali</button>
				<img class="clear" src="assets/image.png" style="width: 98%; height: calc(98% * var(--a-ratio)); top: calc(1% * var(--a-ratio)); left: 1%; position: absolute; z-index: -2;">
				<div class="clear white" style="width: 95%; height: calc(91% * calc(1 - var(--a-ratio))); bottom: calc(2.5% * var(--a-ratio)); left: 2.5%; position: absolute;">hey</div>
			</div>
		</div>
		<div style="width:100%; display: inline;">
			<div class="clear white" style="width: 50%; height: 50%;">
				<button class="clear white" style="width: 10%; height: 50%;"></button>
			</div>
		</div>
	</div>
	<button id="bottomBar" class="clear black" style="height:50%; width: 200%; bottom: 0; left: 50%; translate: -50% 90%; position: fixed; --intensity: 10;">
		<div id = "bottomBarDisplay" style="height: 10%; width: 100%; top: 0%; position: absolute; transition: rotate 0.5s;">^</div>
	</button>
	</div>
</div>
<script type="module">
	import {request} from "/static.js"

	// Layout Functionality
	const doc = document.querySelector(".doc")
	var divPos = 0
	
	document.addEventListener("wheel", (event) => {
		if (!event.deltaY) {
			return
		}

		divPos = Math.min(Math.max(divPos - event.deltaY - event.deltaX, window.innerWidth - doc.scrollWidth), 0)
		doc.style.translate = `${divPos}px`
		event.preventDefault()
	})

	// Style Functionality
	function sizeChanged() {
		document.querySelectorAll(".clear").forEach(instance => {
			let style = window.getComputedStyle(instance)

			instance.style.setProperty("--xScale", 1 / parseInt(style.width))
			instance.style.setProperty("--yScale", 1 / parseInt(style.height))
		})
	}

	sizeChanged()

	window.addEventListener("resize", () => {
		sizeChanged()
	})

	// Bottom Bar
	const bBar = document.getElementById("bottomBar")
	const bBarDisplay = document.getElementById("bottomBarDisplay")
	var bBarOpen = false
	var bBarClicks = 0
	bBar.addEventListener("mousedown", (event) => {
		if (bBarOpen == true) {
			bBar.style.translate = "-50% 90%"
		} else {
			bBar.style.translate = "-50% 10%"
		}

		bBarOpen = !bBarOpen
		bBarClicks++
		
		bBarDisplay.style.rotate = `${bBarClicks * 180}deg`
	})

	// Name Phrases
	const name = document.getElementById("name")
	request("assets/namePhrases.json").then((data) => {
		let index = 0
		const phrases = data.phrases
		
		name.innerHTML = `Rowan Vignali<br><small>${phrases[index++]}</small>`

		name.addEventListener("mousedown", (event) => {
			name.innerHTML = `Rowan Vignali<br><small>${phrases[index++]}</small>`
			index %= phrases.length
		})
	})
</script>
